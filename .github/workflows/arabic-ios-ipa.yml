name: Arabic iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VITE_DEFAULT_LANG: ar
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Arabic mobile app
        working-directory: frontend
        run: npm run build:mobile

      - name: Add iOS extensions
        working-directory: frontend
        run: |
          ruby ios/ci/add-asset-downloader.rb
          ruby ios/ci/add-watch-app.rb
          ruby ios/ci/add-widgets.rb

      - name: Archive without signing
        working-directory: frontend/ios/App
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive \
            | tee build/archive.log
          test -d build/App.xcarchive/Products/Applications/App.app

      - name: Package IPA
        working-directory: frontend/ios/App
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -qry openGym-Arabic-unsigned.ipa Payload
          test -s openGym-Arabic-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: openGym-Arabic-unsigned-ipa
          path: frontend/ios/App/build/openGym-Arabic-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
